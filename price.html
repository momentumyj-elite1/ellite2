<script>
const CHAT = [
  {who:'them', first:true, html:'안녕하세요! 강남 엘리트예요 😊<br>무엇을 도와드릴까요?'},
  {who:'me',   html:'가격이 궁금합니다'},
  {who:'them', html:'비용은 크게 세 가지로 구성돼요 👇<br><br><b>주대</b> · 양주(술)<br><b>TC</b> · 매니저 이용<br><b>RT</b> · 룸 이용료'},
  {who:'me',   html:'2명인데 2타임 놀려면<br>얼마나 들까요?'},
  {who:'them', html:'기본적으로 1타임은 1시간씩 진행돼요.<br>2명 2타임 기준으로 예를 들면 👇<span class="bill"><span class="row"><span>주대 · 양주 1병</span><span>100,000</span></span><span class="row"><span>TC · 매니저</span><span>540,000</span></span><span class="row"><span>RT · 룸 이용료</span><span>50,000</span></span><span class="row total"><span>합계</span><span>690,000</span></span></span>이렇게 안내돼요.'},
  {who:'me',   html:'지금 강남역인데<br>차 보내주실 수 있나요?'},
  {who:'them', html:'네, 물론이죠! 🚗<br>지금 바로 보내드릴게요. 계신 곳만 알려주시면<br>차량 도착 시 안내해드립니다.'},
  {who:'me',   html:'술이 비싼데 부족하면<br>계속 시켜야 하나요?'},
  {who:'them', html:'의무적으로 술을 추가하는 타임이 있어요.<br>(보통 첫 타임, 4타임, 8타임 등)<br><br>다만 그 시간을 제외하면, 개인적으로 보관 중인 <b>킵술</b>을 만족하실 만큼 제공해드려요 🥃'},
  {who:'them', html:'더 궁금하신 점은 편하게 전화 주세요.<br>정확한 견적, 바로 알려드릴게요 📞'},
];

const body = document.getElementById('dmBody');
let shown = 0;

function renderMsg(m){
  const div = document.createElement('div');
  div.className = 'msg ' + m.who + (m.first ? ' first' : '');
  div.innerHTML = m.html;
  body.appendChild(div);
}

function showNext(){
  if (shown >= CHAT.length) return;
  renderMsg(CHAT[shown]);
  shown++;
  if (shown < CHAT.length){
    const delay = CHAT[shown-1].who === 'me' ? 450 : 700;
    setTimeout(showNext, delay);
  }
}

window.addEventListener('load', () => setTimeout(showNext, 400));

function toggleDrawer(btn){
  const d = document.getElementById('navDrawer');
  if (d) d.classList.toggle('open');
  if (btn) btn.classList.toggle('active');
}
</script>
